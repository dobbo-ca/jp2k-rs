name: ab
on:
  workflow_dispatch:
    inputs:
      base:
        description: Ref of build A (build B is the dispatched ref)
        default: main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Not a check: the bench example built from `base` (A) and from the dispatched ref (B), timed
  # alternately on one runner (tests/parity/ab.sh), so a change's before/after numbers come from
  # the same CPU. The bench image is built twice; the binaries run on the runner.
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, fetch-depth: 0, persist-credentials: false }
      - env:
          BASE: ${{ inputs.base }}
        run: git worktree add "$RUNNER_TEMP/base" "origin/$BASE" || git worktree add "$RUNNER_TEMP/base" "$BASE"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/base
          file: ${{ runner.temp }}/base/.github/ci/Dockerfile
          target: bench
          cache-from: type=gha,scope=jp2k-rs-bench
          load: true
          push: false
          tags: jp2k-ab:a
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench
          cache-from: type=gha,scope=jp2k-rs-bench
          load: true
          push: false
          tags: jp2k-ab:b
      - env:
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          for x in a b; do docker create --name "ab-$x" "jp2k-ab:$x" && docker cp "ab-$x:/usr/local/bin/bench" "./bench-$x"; done
          { echo "A: \`$BASE\` $(git -C "$RUNNER_TEMP/base" rev-parse --short HEAD), B: \`$HEAD_REF\` $(git rev-parse --short HEAD)"; echo; sh tests/parity/ab.sh ./bench-a ./bench-b; } | tee -a "$GITHUB_STEP_SUMMARY"
